services:
  - type: web
    name: oddsmith-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AIML_API_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: COGNEE_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
